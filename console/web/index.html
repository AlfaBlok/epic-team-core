<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>EpicTeam</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- the phone's status bar and system bar take the app's colour (dark #09090b, light #ffffff); the script below
         sets them to the theme the app opens in. The status bar is see-through on iOS, the page pads under it (safe-area). -->
    <meta name="theme-color" content="#09090b" data-app-theme>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- installable from the phone's browser (Add to Home Screen opens it full screen, its own icon, no browser bar). -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="EpicTeam">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EpicTeam">
    <meta property="og:url" content="https://team.example.com/">
    <meta property="og:title" content="EpicTeam">
    <meta property="og:description" content="The agent team's console. Goals, reviews and asks in one place.">
    <meta property="og:image" content="https://team.example.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="EpicTeam">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="EpicTeam">
    <meta name="twitter:description" content="The agent team's console. Goals, reviews and asks in one place.">
    <meta name="twitter:image" content="https://team.example.com/og-image.png">
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        else {
          document.querySelector("meta[data-app-theme]").content = "#ffffff";
          // Light theme: an opaque light status bar (white text on a light page would vanish).
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = "default";
        }
      } catch {}
    </script>
    <script>
      // what the first screen shows starts downloading now, beside the app's code (on a phone the code took ~3 s and
      // only then did the lists start). The app takes each answer once (src/api/real.ts takeEarly); a failed one is
      // asked again the normal way. Only on Home (/), the Inbox (/inbox) and Chat (/chat), so no other page downloads them for nothing.
      // Home is the goals view (its list is /scorecards), so Home asks for that first and leaves the Inbox's
      // lists (~110 KB on the wire) to after the code, when they no longer slow the goals list on a slow phone link;
      // a social site's Home is its campaigns and keeps the Inbox's lists, as /inbox does. Every list a section of the Inbox
      // waits on is here (the Inbox draws all its sections at once, so the last list to start sets when it draws).
      try {
        var at = location.pathname, social = /social/i.test(location.hostname);
        // the Inbox reads its open asks first (14 KB, src/lib/data.ts useWaitingList), so that is the one asked here;
        // the whole list (120 KB) asked here took the phone's line from the app's code and the open asks waited for the
        // code. The tiny reads it waits on to draw (who he is, the counts, what he already pressed, the cards sent back,
        // the connect cards, the threads and worlds its page reads) come along: each under 2 KB, each one round trip
        // (0.6 s on a phone line) less after the code.
        var inbox = ["/waiting-on-owner?scope=open&includeSuperseded=true&view=list", "/status", "/review-items", "/laptop", "/inbox/team-cards", "/review-items?state=snoozed", "/me", "/counts", "/presses/answered", "/sent-back-cards", "/connects", "/threads", "/worlds"];
        // Chat (/chat, the console skin) asks its last 20 messages now too: they waited for the app's code and then Chat's
        // own script, ~1.2 s on Slow 4G.
        var paths = at === "/inbox" || (at === "/" && social) ? inbox : at === "/" ? ["/scorecards", "/status", "/laptop"] : at === "/chat" && !social ? ["/desk/messages?limit=20"] : [];
        var early = (window.__earlyGets = {});
        paths.forEach(function (p) {
          // a saved copy from the service worker is noted (x-saved-copy), so the Inbox says so
          var e = (early[p] = { at: Date.now() });
          // never left hanging (a hung early read froze his phone's chat): given up after 8 s, the app reads it again
          var o = typeof AbortSignal !== "undefined" && AbortSignal.timeout ? { signal: AbortSignal.timeout(8000) } : undefined;
          e.p = fetch("/api" + p, o).then(function (r) { e.saved = r.headers.get("x-saved-copy") || undefined; return r.ok ? r.json() : null; }).catch(function () { return null; });
        });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
